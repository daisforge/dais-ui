# Default values for app.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: syngx
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ''

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ''

podAnnotations:
  vault.hashicorp.com/agent-inject: 'true'
  vault.hashicorp.com/service: https://t.secrets.dddddd.ru
  vault.hashicorp.com/namespace: CI00752881_CI00685134
  vault.hashicorp.com/role: ci00752881-i-ci02918303-sbercost-dev
  vault.hashicorp.com/agent-init-first: 'true'
  vault.hashicorp.com/agent-pre-populate: 'false'
  vault.hashicorp.com/agent-pre-populate-only: 'false'
  vault.hashicorp.com/agent-run-as-user: '10001'
  vault.hashicorp.com/agent-run-as-group: '10001'
  vault.hashicorp.com/agent-run-as-same-user: 'false'
  vault.hashicorp.com/secret-volume-path: /syngx/certs
  vault.hashicorp.com/agent-inject-template-client.crt: |
    {{- with secret "A/CI03129272/OSH/CI03575617/KV/ai-hub-crt" }}
    {{ index .Data "pem" }}
    {{- end }}
  vault.hashicorp.com/agent-inject-perms-client.crt: '0400'
  vault.hashicorp.com/agent-inject-secret-client.crt: 'true'
  vault.hashicorp.com/agent-inject-template-client.key: |
    {{- with secret "A/CI03129272/OSH/CI03575617/KV/ai-hub-crt" }}
    {{ index .Data "key" }}
    {{- end }}
  vault.hashicorp.com/agent-inject-perms-client.key: '0400'
  vault.hashicorp.com/agent-inject-secret-client.key: 'true'
  vault.hashicorp.com/agent-inject-template-ca.crt: |
    {{- with secret "A/CI03129272/OSH/CI03575617/KV/ai-hub-crt" }}
    {{ index .Data "ca" }}
    {{- end }}
  vault.hashicorp.com/agent-inject-perms-ca.crt: '0400'
  vault.hashicorp.com/agent-inject-secret-ca.crt: 'true'

podLabels:
  secman-injector: enabled

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ''
  annotations: {}
    # kubernetes.io/ingress.class: syngx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes:
  - name: volume-run
    emptyDir: {}

# Additional volumeMounts on the output Deployment definition.
volumeMounts:
  - name: volume-run
    mountPath: /tmp

nodeSelector: {}

tolerations: []

affinity: {}
