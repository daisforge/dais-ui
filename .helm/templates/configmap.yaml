kind: ConfigMap
apiVersion: v1
metadata:
  name: df-syngx-cfg
  labels:
    {{- include "app.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
        listen       8080;
        listen  [::]:8080;
        server_name  localhost;

        location / {
            root   /var/www/html;
            index  index.html index.htm;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
