name: PR Preview Storybook

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'packages/storybook/**'
      - 'packages/ui-kit/**'
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Только PR из веток этого репозитория (не форки)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm ci --ignore-scripts

      - name: Build Storybook
        if: github.event.action != 'closed'
        run: npm run storybook:build
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          # Превью публикуется под /<repo>/pr-preview/pr-<N>/ — base должен это учитывать,
          # иначе JS-чанки и другие ассеты резолвятся по неверным путям и 404-ятся.
          STORYBOOK_BASE_PATH: '/${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.pull_request.number }}/'

      # НЕ кладём .nojekyll сюда: единственный .nojekyll живёт в корне gh-pages
      # (из деплоя develop) и действует на весь сайт целиком. Второй .nojekyll
      # тут не будет удалён при закрытии PR и будет копиться мусором в gh-pages.

      - name: Deploy PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist/storybook
          preview-branch: gh-pages
          umbrella-dir: pr-preview
