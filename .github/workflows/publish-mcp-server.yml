name: Publish MCP server package

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Тип версии (semver)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      dry_run:
        description: 'Тестовый прогон (npm publish --dry-run), без реальной публикации'
        required: true
        type: boolean
        default: true
  workflow_call:
    inputs:
      bump:
        description: 'Тип версии (semver)'
        required: false
        type: string
        default: patch
      dry_run:
        description: 'Тестовый прогон (npm publish --dry-run), без реальной публикации'
        required: false
        type: boolean
        default: true
    secrets:
      NPM_TOKEN:
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install mcp-server dependencies
        run: npm run mcp:ci

      # dist/packages/ui-kit в этом чекауте не собран — buildIndex.js запишет
      # только запасной "bundled" индекс в packages/mcp-server/data/, это и нужно
      # для публикации самого @daisforge/ui-mcp.
      - name: Build component index
        run: npm run mcp:build-index

      - name: Validate component index
        run: npm run mcp:validate-index

      - name: Bump version
        id: version
        working-directory: packages/mcp-server
        run: |
          npm version ${{ inputs.bump }} --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git add packages/mcp-server/package.json packages/mcp-server/package-lock.json packages/mcp-server/data/component-index.json
          git commit -m "chore(release-mcp): ui-mcp v${{ steps.version.outputs.version }}"
          git tag "ui-mcp-v${{ steps.version.outputs.version }}"

      - name: Publish to npm
        working-directory: packages/mcp-server
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Пушим релизный коммит и тег ТОЛЬКО при реальной публикации (не dry-run) —
      # аналогично publish-npm.yml, чтобы в main не попадал коммит/тег без
      # реально опубликованного пакета.
      - name: Push release commit and tag
        if: ${{ inputs.dry_run != true }}
        run: git push --follow-tags origin main
