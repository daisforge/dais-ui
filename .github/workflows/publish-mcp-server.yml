name: Publish MCP server package

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Тип версии (semver)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      dry_run:
        description: 'Тестовый прогон (npm publish --dry-run), без реальной публикации'
        required: true
        type: boolean
        default: true
      publish_alias:
        description: 'Публиковать также зеркальный (white-label) пакет'
        required: true
        type: boolean
        default: true
      refresh_vendor:
        description: 'Обновить вендорный снэпшот атомарных пропсов с CDN перед сборкой индекса'
        required: true
        type: boolean
        default: true
  workflow_call:
    inputs:
      bump:
        description: 'Тип версии (semver)'
        required: false
        type: string
        default: patch
      dry_run:
        description: 'Тестовый прогон (npm publish --dry-run), без реальной публикации'
        required: false
        type: boolean
        default: true
      publish_alias:
        description: 'Публиковать также зеркальный (white-label) пакет'
        required: false
        type: boolean
        default: true
      refresh_vendor:
        description: 'Обновить вендорный снэпшот атомарных пропсов с CDN перед сборкой индекса'
        required: false
        type: boolean
        default: true
      # Какую ревизию чекаутить. При вызове из publish-npm.yml сюда приходит
      # 'main': к этому моменту релиз ui-kit уже запушил туда свой lerna-коммит,
      # а github.sha вызывающего события указывает на состояние ДО него — работа
      # поверх него дала бы non-fast-forward на нашем `git push`.
      ref:
        description: 'Ветка или SHA для чекаута (по умолчанию — ревизия события)'
        required: false
        type: string
        default: ''
    # Все секреты этого workflow (RELEASE_DEPLOY_KEY, ALT_*_PACKAGE_NAME) лежат
    # в environment `release` и берутся job'ом напрямую — через workflow_call их
    # не передать. Объявление ALT_* оставлено для совместимости, пока они не
    # удалены из секретов репозитория: секрет environment имеет приоритет.
    # Не required: без них шаги зеркала просто пропускаются (см. if ниже) —
    # форк или прогон в репозитории без этих секретов не должен падать.
    # npm-токенов нет: оба пакета публикуются через Trusted Publishing.
    secrets:
      ALT_MCP_PACKAGE_NAME:
        required: false
      ALT_LIB_PACKAGE_NAME:
        required: false

# Пуш идёт по deploy key, GITHUB_TOKEN писать не нужно.
# id-token: write — Trusted Publishing (OIDC) для @daisforge/ui-mcp.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Пускает только ветку main (и ключ, и OIDC-публикация привязаны к нему):
    # ручной запуск, в том числе dry_run, — только с main.
    environment: release
    env:
      NX_DAEMON: 'false'
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      # Та же проверка, что в publish-npm.yml: ключ обязан работать до любой
      # публикации, иначе пакеты уехали бы в npm без коммита и тега.
      - name: Verify release deploy key
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          if [ -z "$RELEASE_DEPLOY_KEY" ]; then
            echo "::error::Секрет RELEASE_DEPLOY_KEY не задан в environment release."
            exit 1
          fi
          ORIGIN_URL=$(git remote get-url origin)
          case "$ORIGIN_URL" in
            git@github.com:*) ;;
            *) echo "::error::origin не SSH ($ORIGIN_URL) — пуш по deploy key невозможен."; exit 1 ;;
          esac
          if ! git ls-remote --exit-code origin HEAD > /dev/null; then
            echo "::error::GitHub не принял RELEASE_DEPLOY_KEY (ключ удалён из Deploy keys?)."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install mcp-server dependencies
        run: npm run mcp:ci

      # Вендорный снэпшот атомарных пропсов тянется с того же CDN, поверх
      # которого работает официальный @salutejs/sdds-mcp. Версия берётся не
      # "latest", а та, что реально установлена в этом чекауте (см.
      # vendorAtomicData.ts): индекс не должен обещать пропсы, которых у
      # потребителя нет. Если такой версии на CDN не оказалось, шаг оставляет
      # закоммиченный снэпшот как есть (--on-missing=keep) и печатает warning —
      # релиз из-за этого не встаёт.
      - name: Refresh atomic vendor snapshot
        if: ${{ inputs.refresh_vendor }}
        run: npm run mcp:vendor-atomic

      # Второй источник, идёт сразу за первым: проза документации атомарки.
      # В бандле на CDN её нет — их генератор режет summary компонента по 300
      # символов (медиана 44, у трети остаётся голое имя). Поэтому текст
      # берётся из первого скрипта их же пайплайна (generateIndex) на sparse-
      # чекауте тега @salutejs/sdds-finai@<установленная версия>: ~10 секунд,
      # 17 МБ. Сборка докусауруса не нужна — раскрытие <PropsTable> у них
      # опционально, а пропсы у нас свои. Подробности — ARCHITECTURE §1.6d.
      - name: Harvest atomic docs
        if: ${{ inputs.refresh_vendor }}
        run: npm run mcp:harvest-docs

      # dist/packages/ui-kit в этом чекауте не собран — buildIndex.js запишет
      # только запасной "bundled" индекс в packages/mcp-server/data/, это и нужно
      # для публикации самого @daisforge/ui-mcp.
      - name: Build and check MCP
        run: npm run mcp:check

      - name: Bump version
        id: version
        working-directory: packages/mcp-server
        run: |
          npm version ${{ inputs.bump }} --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git add packages/mcp-server/package.json packages/mcp-server/package-lock.json packages/mcp-server/data/component-index.json packages/mcp-server/vendor
          git commit -m "chore(release-mcp): ui-mcp v${{ steps.version.outputs.version }}"
          git tag -a "ui-mcp-v${{ steps.version.outputs.version }}" -m "ui-mcp v${{ steps.version.outputs.version }}"

      # Зеркальный (white-label) пакет: тот же собранный dist и тот же индекс,
      # но под другим именем пакета и с другим именем связанной библиотеки.
      # Имена лежат в секретах, в репозитории их нет — см.
      # packages/mcp-server/scripts/build-alias-package.mjs.
      #
      # Зеркало публикуется ПЕРВЫМ, до основного пакета: у него своя настройка
      # trusted publisher на npmjs.com и своя история версий, и если публикация
      # падает, job обрывается до публикации @daisforge/ui-mcp и до git push —
      # ничего не опубликовано, ничего не запушено, повтор чистый. В обратном
      # порядке основной пакет уже уехал бы в npm без коммита и тега.
      #
      # Флаг считается отдельным шагом, а не прямо в `if`: контекст secrets в
      # условиях шагов недоступен, проверить «секрет не пуст» можно только
      # через env внутри run.
      - name: Resolve alias publish flag
        id: alias
        env:
          ALT_MCP_PACKAGE_NAME: ${{ secrets.ALT_MCP_PACKAGE_NAME }}
          ALT_LIB_PACKAGE_NAME: ${{ secrets.ALT_LIB_PACKAGE_NAME }}
        run: |
          if [ "${{ inputs.publish_alias }}" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Зеркальный пакет отключён параметром publish_alias."
          elif [ -z "$ALT_MCP_PACKAGE_NAME" ] || [ -z "$ALT_LIB_PACKAGE_NAME" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Секреты ALT_MCP_PACKAGE_NAME / ALT_LIB_PACKAGE_NAME заданы не полностью — зеркальный пакет пропущен."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # Trusted Publishing требует npm >= 11.5.1, а с Node 20 идёт npm 10.
      # Обновляется после установки зависимостей — см. publish-npm.yml.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      # ALIAS_OUT_DIR обязателен и обязан быть вне рабочего дерева: npm ищет
      # .git вверх от каталога пакета и, найдя, штампует в манифест gitHead с
      # SHA текущего HEAD (см. @npmcli/package-json/lib/normalize.js). У
      # опубликованного @daisforge/ui-mcp это поле есть — одинаковый SHA у двух
      # пакетов связал бы зеркало с основным. runner.temp лежит рядом с
      # чекаутом, но своего .git не имеет. Скрипт проверяет это сам и падает,
      # если каталог всё же окажется внутри репозитория.
      - name: Build alias package
        if: steps.alias.outputs.enabled == 'true'
        run: npm run mcp:alias:stage --prefix packages/mcp-server
        env:
          ALT_MCP_PACKAGE_NAME: ${{ secrets.ALT_MCP_PACKAGE_NAME }}
          ALT_LIB_PACKAGE_NAME: ${{ secrets.ALT_LIB_PACKAGE_NAME }}
          ALIAS_OUT_DIR: ${{ runner.temp }}/mcp-alias-package

      # Trusted Publishing (OIDC), как и у основного пакета: у зеркала на
      # npmjs.com настроен trusted publisher на этот репозиторий. Provenance
      # добавляется автоматически и указывает на этот репозиторий — это
      # принято сознательно: зеркало публикуется тем же npm-аккаунтом, что и
      # @daisforge/*, так что связь и без того видна в списке maintainers.
      - name: Publish alias package to npm
        if: steps.alias.outputs.enabled == 'true'
        working-directory: ${{ runner.temp }}/mcp-alias-package
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public
          fi

      # Без NODE_AUTH_TOKEN — Trusted Publishing (OIDC), provenance автоматически.
      - name: Publish to npm
        working-directory: packages/mcp-server
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public
          fi

      # Пушим релизный коммит и тег ТОЛЬКО при реальной публикации (не dry-run) —
      # аналогично publish-npm.yml, чтобы не попадал коммит/тег без реально
      # опубликованного пакета. Пуш — по deploy key (см. checkout), в ветку
      # запуска; environment release допускает только main.
      # Тег пушится явно по имени (не через --follow-tags — он молча пропускает
      # lightweight-теги, из-за чего тег v0.1.1 однажды не уехал на remote).
      - name: Push release commit and tag
        if: ${{ inputs.dry_run != true }}
        run: |
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "refs/tags/ui-mcp-v${{ steps.version.outputs.version }}"
