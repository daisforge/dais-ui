name: Deploy Storybook

on:
  push:
    branches:
      - develop
    paths:
      - 'packages/storybook/**'
      - 'packages/ui-kit/**'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build Storybook
        run: npm run storybook:build
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          # GitHub Pages для project-страниц отдаёт сайт с /<repo>/, а не с корня домена
          STORYBOOK_BASE_PATH: '/${{ github.event.repository.name }}/'

      - name: Preserve active PR previews 🔒
        run: |
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1 && \
             git cat-file -e origin/gh-pages:pr-preview 2>/dev/null; then
              git archive origin/gh-pages -- pr-preview | tar -x -C dist/storybook
          fi

      - name: Add .nojekyll
        run: touch dist/storybook/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/storybook
          publish_branch: gh-pages
