name: Publish npm package

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    if: "!contains(github.event.head_commit.message, 'chore(release)')"
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release_flags.outputs.released }}
      mcp_touched: ${{ steps.release_flags.outputs.mcp_touched }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Record HEAD before version bump
        id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Version bump (lerna conventional commits)
        run: npx lerna version --conventional-commits --yes

      - name: Record HEAD after version bump
        id: after
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Признаки для хвостового job'а publish-mcp (см. конец файла). Считаются
      # по явным SHA исходного пуша, поэтому локальный lerna-коммит на них не
      # влияет. `mcp_touched` нужен отдельно от `released`: @daisforge/ui-mcp не
      # входит в npm workspaces, лерна его не версионирует, и мерж, тронувший
      # только packages/mcp-server, иначе не привёл бы к релизу ui-mcp никогда.
      - name: Resolve downstream release flags
        id: release_flags
        run: |
          if [ "${{ steps.before.outputs.sha }}" != "${{ steps.after.outputs.sha }}" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null &&
             git diff --name-only "$BEFORE" "${{ github.sha }}" -- packages/mcp-server | grep -q .; then
            echo "mcp_touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "mcp_touched=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ui-kit
        if: steps.before.outputs.sha != steps.after.outputs.sha
        run: npx nx build ui-kit
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          NODE_ENV: production

      # buildIndex.js пишет component-index.json в dist/packages/ui-kit/mcp-data
      # только если dist/packages/ui-kit уже существует (см. buildIndex.ts) — на этом
      # шаге он уже собран предыдущим шагом. У ui-kit/package.json нет поля "files",
      # поэтому mcp-data уедет в npm-тарболл вместе с остальным dist как есть.
      # Без этого шага tier "installed" в resolveIndex.ts (@daisforge/ui-mcp)
      # никогда не сработает ни для одной опубликованной версии @daisforge/ui.
      #
      # `npm run meta` обязателен и идёт первым: _docs/meta лежит в .gitignore,
      # в CI-чекауте его нет, а без него индексер терял features/guides/curated-
      # описания/full-code примеры — ровно так выпотрошенный индекс однажды уехал
      # в npm. Сейчас индексер на отсутствующей мете падает (assertMetaAvailable),
      # то есть без этой строки шаг просто не пройдёт.
      - name: Embed MCP component index into ui-kit dist
        if: steps.before.outputs.sha != steps.after.outputs.sha
        run: |
          npm run meta
          npm run mcp:ci
          npm run build --prefix packages/mcp-server
          node ./packages/mcp-server/dist/indexer/buildIndex.js

      - name: Publish to npm
        if: steps.before.outputs.sha != steps.after.outputs.sha
        working-directory: dist/packages/ui-kit
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Пушим релизный коммит и тег ТОЛЬКО после успешной публикации в npm.
      # Если сборка или publish упадут выше — job зафейлится раньше этого шага,
      # и в main не попадёт "пустой" релизный коммит/тег без реально опубликованного пакета.
      - name: Push release commit and tag
        if: steps.before.outputs.sha != steps.after.outputs.sha
        run: git push --follow-tags origin main

  # @daisforge/ui-mcp публикуется последним шагом релиза библиотеки: его
  # bundled-индекс собирается из исходников ui-kit, поэтому свежий ui-mcp имеет
  # смысл ровно после выхода новой версии @daisforge/ui. Отдельным push-триггером
  # это не делается сознательно — оба workflow пушили бы коммиты в main
  # одновременно, и второй получал бы non-fast-forward.
  #
  # ref: main — обязательно: к этому моменту lerna-коммит уже в main, а
  # github.sha события указывает на состояние до него.
  publish-mcp:
    needs: publish
    if: needs.publish.outputs.released == 'true' || needs.publish.outputs.mcp_touched == 'true'
    uses: ./.github/workflows/publish-mcp-server.yml
    with:
      bump: patch
      dry_run: false
      publish_alias: true
      refresh_vendor: true
      ref: main
    secrets: inherit
