name: Require PR source branch

on:
  pull_request:
    branches:
      - main

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR into main comes from develop
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "::error::PR в main разрешён только из ветки develop (источник этого PR: ${{ github.head_ref }})"
            exit 1
          fi
          echo "OK: источник PR — develop"
