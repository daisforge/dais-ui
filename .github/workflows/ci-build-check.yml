name: CI build check

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare MCP for lint and typecheck
        run: npm run mcp:ci

      - name: Lint
        run: npm run lint

      # Файлы *.string.json, на которые опирается Storybook, в .gitignore.
      # Без генерации storybook:typecheck падает (так же в Dockerfile.screenshots)
      - name: Generate Storybook docs utils
        run: npm run generate-storybook-docs-utils

      # tsc по nx-проектам: ui-kit (код и тесты), storybook, mcp-server.
      # Цели идут параллельно, ~1,5 мин. До этого шага типы проверял только
      # необязательный job Screenshots, и ошибка типов не блокировала merge.
      # tsc storybook занимает ~3,1 ГБ и не помещается в кучу node по
      # умолчанию, поэтому лимит поднят, как у сборки ui-kit
      - name: Typecheck
        run: npx nx run-many --targets=typecheck,typecheck-tests
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'

      # Остальное в test/ уже проверяет storybook:typecheck. Этот шаг нужен
      # для файлов, которые он не видит: redraw/specs/*.spec.ts (исключены
      # как *.spec.ts) и .storybook/test-runner.ts (скрытая папка)
      - name: Typecheck screenshot and redraw tests
        run: npm run screenshot:typecheck && npm run redraw:typecheck
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'

      # ESLint (с prettier/prettier) проверяет только код; Markdown форматирует
      # pre-commit через lint-staged. Эта проверка ловит то, что прошло мимо хука:
      # коммит с --no-verify, правка в веб-интерфейсе GitHub. Исправить:
      # npm run format:md. Генерируемые файлы исключены в .prettierignore.
      - name: Check Markdown formatting
        run: npm run format:md:check

      # Node-скрипты white-label и пакета Storybook не входят ни в один
      # nx-проект, поэтому `npm run lint` их не видит. Без этих шагов поломка
      # всплыла бы только на релизе (publish-npm → publish-storybook-package).
      - name: Lint Node scripts
        run: npm run lint:scripts

      # Claude Code читает скиллы только из .claude/skills, а источник — в
      # .agents/skills (их читает Codex). Копии должны совпадать.
      - name: Check agent skills copies
        run: npm run skills:check

      - name: Test white-label scripts
        run: npm run white-label:test

      - name: Test Storybook package scripts
        run: npm run storybook-package:test

      # Плагины сборки (plugins/) тоже вне nx-проектов. Проверки графа чанков
      # (vite-df-ui-chunks.checks.ts) сборка ui-kit ниже запускает на
      # настоящем бандле, а тесты проверяют граничные случаи на поддельном.
      - name: Lint build plugins
        run: npm run lint:plugins

      - name: Typecheck build plugins
        run: npm run plugins:typecheck

      - name: Test build plugins
        run: npm run plugins:test

      - name: Build ui-kit
        run: npx nx build ui-kit
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'

      # Отчёты о публичном API (packages/ui-kit/api/*.api.md — корень и
      # документированные подпути) должны совпадать с типами только что
      # собранного пакета. Так любое изменение экспортов и пропсов видно в diff
      # PR отдельными файлами.
      - name: Check public API report
        run: |
          npm run api:check || {
            echo "::error::Проверка отчётов о публичном API не прошла. Причина и diff — в логе шага выше, порядок работы — в Contributing.md, раздел «Отчёт о публичном API»."
            exit 1
          }
