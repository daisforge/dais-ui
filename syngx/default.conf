# This number should be, at maximum, the number of CPU cores on your system.
worker_processes  auto;
worker_rlimit_nofile 128000;
# Only log critical errors.
error_log  /dev/stderr crit;
pid        /var/log/syngx/syngx.pid;

#load_module /opt/syngx/modules/ndk_http_module.so;
#load_module /opt/syngx/modules/ngx_http_brotli_filter_module.so;
#load_module /opt/syngx/modules/ngx_http_brotli_static_module.so;
#load_module /opt/syngx/modules/ngx_http_lua_module.so;
#load_module /opt/syngx/modules/ngx_http_sslkeylog_module.so;
#load_module /opt/syngx/modules/ngx_http_stream_server_traffic_status_module.so;
#load_module /opt/syngx/modules/ngx_stream_js_module.so;
#load_module /opt/syngx/modules/ngx_stream_lua_module.so;
#load_module /opt/syngx/modules/ngx_stream_server_traffic_status_module.so;
#load_module /opt/syngx/modules/ngx_http_set_misc_module.so
#load_module /opt/syngx/modules/ngx_hashicorp_vault_module.so

events {
    worker_connections  1024;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Maximum request size configuration to reduce the likelihood of a successful DDoS attack
    variables_hash_bucket_size 64;
    variables_hash_max_size 4096;
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    client_max_body_size 16M;
    large_client_header_buffers 4 8k;
    map_hash_bucket_size 2048;

    # Hide SynGX version number
    server_tokens        off;
    sendfile        on;
    keepalive_timeout  65;

    include /tmp/syngx/conf.d/*.conf;
    # old include, do not use mount in this directory CS-OSE-82
    include /opt/syngx/conf.d/*.conf;

    # Hide SynGX name
    more_clear_headers  "Server";
    # Prevents the browser from doing MIME-type sniffing (prevents "mime" based attacks)
    more_set_headers    "X-Content-Type-Options: nosniff";
    # Not be allowed to render a page in a frame
    more_set_headers    "X-Frame-Options: SAMEORIGIN";
    # Enable the cross-site scripting (XSS) filter built into modern web browsers
    more_set_headers    "X-XSS-Protection: 1; mode=block";
    # Hide proxy name
    more_clear_headers   "Server";
    # Hide backend headers
    more_clear_headers  "X-Powered-By";
    # Enabling the header prevents the browser from accessing resources over the HTTP protocol, only HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include       /opt/syngx/conf/mime.types;
    default_type  application/octet-stream;
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    server {
        listen 8080;

        include /syngx/conf.d/*.conf;

        location / {
            add_header  Allow  "GET, HEAD, OPTIONS" always;
            if ( $request_method !~ ^(GET|HEAD|OPTIONS)$ ) {
                return 405;
            }
            root   /opt/syngx/html/;
            index  index.html;
        }
        location /status_prometheus {
            add_header  Allow  "GET, HEAD, OPTIONS" always;
            if ( $request_method !~ ^(GET|HEAD|OPTIONS)$ ) {
                return 405;
            }
            snx_http_extstatus_prometheus on;
            allow  all;
            deny  all;
        }
        location /status_json {
            add_header  Allow  "GET, HEAD, OPTIONS" always;
            if ( $request_method !~ ^(GET|HEAD|OPTIONS)$ ) {
                return 405;
            }
            snx_http_extstatus_json on;
            allow  all;
            deny  all;
        }
   }
}
