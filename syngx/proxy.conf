location /ai-rag-api/ {
    proxy_pass https://lab-dev.ai-finance.dddddd.ru/epm/dais-v10000/api/;
    proxy_http_version 1.1;

    # Заголовки
    proxy_set_header Host lab-dev.ai-finance.dddddd.ru;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # mTLS: nginx → бэкенд
    proxy_ssl_server_name on;
    proxy_ssl_certificate     /vaults/certs/client.pem;
    proxy_ssl_certificate_key /vaults/certs/client-key.pem;
    proxy_ssl_trusted_certificate /vaults/certs/ca.pem;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_session_reuse on;

    # Таймауты
    proxy_connect_timeout 60s;
    proxy_read_timeout 600s;
    proxy_send_timeout 120s;
}
